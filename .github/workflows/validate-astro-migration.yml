name: Validate Astro migration

on:
  push:
    branches: [migration/astro]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: writing
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Annouimo/annouimo-publishing
          ref: d72fccd8bea0e3569aa00ba6990dd12251ee97dd
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import and build
        working-directory: site
        run: |
          python -m pip install 'PyYAML>=6,<7'
          python scripts/import-writing.py ../writing
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: astro-preview-site
          path: site/.cloudflare/output/v0/workers/default/assets/
          if-no-files-found: error
          retention-days: 3
      - name: Deploy isolated Cloudflare preview
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/migration/astro'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-preview.mjs .cloudflare/output/v0/workers/default/assets
