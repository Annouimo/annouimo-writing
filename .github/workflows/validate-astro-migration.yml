name: Validate Astro migration

on:
  push:
    branches: [migration/astro]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: writing
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Annouimo/annouimo-publishing
          ref: 6a4cdcb7f13069be56fc9e72aae708028acdd781
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import and build
        working-directory: site
        run: |
          python -m pip install 'PyYAML>=6,<7' fonttools brotli
          mkdir -p public/fonts
          curl -fL 'https://www.tsanger.cn/download/%E4%BB%93%E8%80%B3%E4%BB%8A%E6%A5%B702-W04.ttf' -o /tmp/tsanger-jinkai-02.ttf
          pyftsubset /tmp/tsanger-jinkai-02.ttf --output-file=public/fonts/tsanger-jinkai-02.woff2 --flavor=woff2 --unicodes='U+0020-024F,U+2000-206F,U+3000-303F,U+3400-4DBF,U+4E00-9FFF,U+F900-FAFF,U+FF00-FFEF'
          curl -fL 'https://raw.githubusercontent.com/JetBrains/JetBrainsMono/19371302b95d218af43299bce79ddbddd0bc364d/fonts/webfonts/JetBrainsMono-Regular.woff2' -o public/fonts/jetbrains-mono-regular.woff2
          python scripts/import-writing.py ../writing
          npm ci
          npm run build:preview
      - uses: actions/upload-artifact@v4
        with:
          name: astro-preview-site
          path: site/.cloudflare/output/v0/workers/default/assets/
          if-no-files-found: error
          retention-days: 3
      - name: Deploy isolated Cloudflare preview
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/migration/astro'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-preview.mjs .cloudflare/output/v0/workers/default/assets
