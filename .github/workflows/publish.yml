name: Legacy Hugo publisher (disabled)

# The Hugo site is no longer the source of production releases.
# Keep this workflow as a visible, harmless stub so the retired path cannot
# overwrite the Astro site if somebody manually selects it in Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the retired publisher
        run: |
          echo "This Hugo publishing workflow is retired."
          echo "Use the Astro publishing workflow after reviewing its preview."
