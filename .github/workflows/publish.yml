name: Publish blog

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: blog-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out writing
        uses: actions/checkout@v4
        with:
          path: writing
          persist-credentials: false
      - name: Check out private Hugo project
        uses: actions/checkout@v4
        with:
          repository: Annouimo/annouimo-blog
          token: ${{ secrets.BLOG_REPO_TOKEN }}
          path: blog
          persist-credentials: false
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Prepare publishable content
        run: python blog/deploy/cloud_publish.py --source writing
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: blog/site/go.mod
      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true
      - name: Build Hugo
        working-directory: blog/site
        run: hugo --gc --minify --cleanDestinationDir
      - name: Deploy Cloudflare Worker
        working-directory: blog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
